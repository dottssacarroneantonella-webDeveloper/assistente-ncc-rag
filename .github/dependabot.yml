version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # i test e la CI usano Python 3.12: si passa alla versione nuova quando lo fa anche la CI
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
      # Node: solo versioni LTS (pari), aggiornate a mano
      - dependency-name: node
        update-types: ["version-update:semver-major"]
