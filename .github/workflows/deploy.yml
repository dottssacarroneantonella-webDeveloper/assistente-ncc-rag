name: Deploy

# Parte solo quando la CI su main è verde: pubblica l'immagine su GitHub Container Registry,
# avvia il deploy della demo su Render e verifica che risponda.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/assistente-ncc-rag

jobs:
  image:
    name: Immagine su GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prova dell'immagine (avvio e /health)
        run: |
          docker run -d --name demo -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" -e CONTACT_HASH_KEY="$(openssl rand -hex 32)" \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/admin/login | grep -q '<div id="root">'
          docker logs demo | tail -20
          docker rm -f demo

  render:
    name: Demo su Render
    needs: image
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Avvia il deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL non impostato: deploy della demo saltato."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
      - name: Verifica della demo
        if: vars.DEMO_URL != ''
        run: |
          # il piano gratuito impiega fino a qualche minuto per build e avvio
          for i in $(seq 1 40); do
            if curl -fsS "${{ vars.DEMO_URL }}/api/v1/health" | grep -q '"status":"ok"'; then
              echo "Demo online"; exit 0
            fi
            sleep 15
          done
          echo "::error::La demo non risponde"; exit 1
