name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installa le dipendenze
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check --config pyproject.toml . ../scripts
          ruff format --check --config pyproject.toml . ../scripts
      - name: Test con copertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Vulnerabilità note nelle dipendenze (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilità note nelle dipendenze (npm audit)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build immagini Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build immagine backend (Docker Compose)
        run: docker build -f backend/Dockerfile -t assistente-ncc-rag-backend:ci .
      - name: Build immagine completa (demo)
        run: docker build -t assistente-ncc-rag:ci .
