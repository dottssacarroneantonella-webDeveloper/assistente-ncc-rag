name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installa le dipendenze
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check --config pyproject.toml . ../scripts
          ruff format --check --config pyproject.toml . ../scripts
      - name: Test con copertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f backend/Dockerfile -t assistente-ncc-rag:ci .
