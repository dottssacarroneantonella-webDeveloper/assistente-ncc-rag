[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-ncc-rag"
version = "0.1.0"
description = "Assistente WhatsApp con RAG per un servizio NCC: risponde alle domande dei clienti usando i documenti dell'attività."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "httpx>=0.27",
    "aio-pika>=9.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "rag-pdf-qa @ git+https://github.com/dottssacarroneantonella-webDeveloper/rag-pdf-qa.git@77efa0d36162710451af0b1854aea201c192f60b",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
semantic = ["rag-pdf-qa[semantic,faiss] @ git+https://github.com/dottssacarroneantonella-webDeveloper/rag-pdf-qa.git@77efa0d36162710451af0b1854aea201c192f60b"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["app"]
omit = ["app/worker/__main__.py", "app/cli.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
