# Ambiente locale completo: PostgreSQL + RabbitMQ + API + worker separato.
#   cp .env.example .env        (e compila i valori)
#   docker compose up --build
# API: http://localhost:8000/api/v1/docs  ·  RabbitMQ: http://localhost:15672
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://assistente:${POSTGRES_PASSWORD:-solo-per-sviluppo-locale}@db:5432/assistente
    QUEUE_BACKEND: rabbitmq
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-assistente}:${RABBITMQ_PASSWORD:-solo-per-sviluppo-locale}@rabbitmq:5672/
    OLLAMA_URL: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - appdata:/srv/backend/data
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistente
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo-per-sviluppo-locale}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assistente}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-solo-per-sviluppo-locale}
    ports:
      - "15672:15672"   # pannello di gestione
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitdata:
  appdata:
